    <!DOCTYPE html>
    <html lang="pt-br">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Conversor de Bases</title>
        <!-- estilo css -->
        <style>
            /* estilo para o corpo da página */
            body {
                font-family: Arial, sans-serif; /* define a fonte utilizada */
                background-image: url(Fundo1.jpg); /* define a cor de fundo do corpo da página */
                background-position: center;  /* Centraliza a imagem */
                background-repeat: no-repeat; /* Impede a repetição da imagem */
                background-size: cover;       /* Faz a imagem cobrir todo o container */
                margin: 10px; /* remove margens externas */
                padding: 100px; /* remove preenchimento externo */
            }

            /* estilo para o contêiner principal */
            #container {
                width: 50%; /* define a largura do contêiner */
                max-width: 900px;
                margin: 10px auto; /* centraliza o contêiner horizontalmente */
                text-align: center; /* alinha o conteúdo ao centro */
                background-image: url(Fundo.png);
                background-position: center;  /* Centraliza a imagem */
                background-repeat: no-repeat; /* Impede a repetição da imagem */
                background-size:contain;       /* Faz a imagem cobrir todo o container */
                padding: 150px ;
                font-family:system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
            }
            

            /* estilo para o cabeçalho */
            h1 {
                color: #1F2A44; /* define a cor do texto do cabeçalho */
                font-family:system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
            }

            /* estilo para a entrada de texto */
            input[type="text"] {
                padding: 8px; /* define o preenchimento interno */
                font-size: 16px; /* define o tamanho da fonte */
                border-radius: 5px; /* define o raio das bordas */
                
            }

            /* estilo para seleção e botão */
            select,
            button {
                padding: 8px; /* define o preenchimento interno */
                font-size: 16px; /* define o tamanho da fonte */
                border-radius: 5px; /* define o raio das bordas */
                cursor: pointer; /* altera o cursor ao passar por cima */
            }

            /* estilo para o botão */
            button {
                background-color: #0a009b; /* define a cor de fundo do botão */
                color: #FFFFFF; /* define a cor do texto do botão */
                border: none; /* remove a borda do botão */
            }

            /* estilo para o botão ao passar o mouse por cima */
            button:hover {
                background-color: #619fef; /* altera a cor de fundo ao passar o mouse */
            }

            /* estilo para a saída de resultados */
            #output {
                margin-top: 20px; /* define a margem superior */
                padding: 80px; /* define o preenchimento interno */
                border-radius: 5px; /* define o raio das bordas */
                background-image: url(Resultado2.png); /* define a cor de fundo */
                border: 1px solid #63666A; /* define a borda */
                text-align: left; /* alinha o texto à esquerda */
                align-items:self-start;
                display: none; /* inicialmente oculta a saída */
                font-family:system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
                background-image: url(Resultado.png);
                background-size: cover; /* Ou 'contain', dependendo do efeito desejado */
                background-position: center;
                background-repeat: no-repeat;
    
                /* 2. Dimensões e legibilidade */
                min-height: 150px; /* Garante uma altura mínima para a imagem aparecer */
                color: rgb(0, 38, 255); /* Muda a cor do texto para branco, que geralmente se destaca mais em imagens */
                text-shadow: 1px 1px 3px rgb(46, 174, 248); /* Adiciona uma sombra ao texto para máxima legibilidade */
            }

            #efeito-conversao {
    display: none; /* Começa escondido */
    position: fixed; /* Fica fixo na tela, sobrepondo tudo */
    top: 0;
    left: 0;
    width: 100vw; /* 100% da largura da tela */
    height: 100vh; /* 100% da altura da tela */
    object-fit: cover; /* Garante que o vídeo cubra a tela inteira sem distorcer */
    z-index: 1; /* Um valor alto para garantir que fique na frente de todos os outros elementos */
}
        </style>

    </head>

    <body style="background-image: url(Fundo1.jpg); background-size: cover; background-position: center;">
         <video id="efeito-conversao" src="Start.mp4" playsinline></video>

        <!-- contêiner principal -->
        <div id="container">
            <!-- título da página -->
            <h1>SAO 'Yuri's MACHINE</h1>
            <!-- entrada de valor -->
            <input id="inputValue" type="text" placeholder="Digite o valor">
            <!-- seleção da base -->
            <select id="inputBase">
                <option value="decimal">Decimal</option>
                <option value="hexadecimal">Hexadecimal</option>
                <option value="octal">Octal</option>
                <option value="binario">Binário</option>
            </select>
            <br><br>
            <!-- opções de conversão -->
            <h3>Converter para:</h3>
            <input type="checkbox" id="convertDecimal"><label for="convertDecimal">Decimal</label>
            <input type="checkbox" id="convertHexadecimal"><label for="convertHexadecimal">Hexadecimal</label>
            <input type="checkbox" id="convertOctal"><label for="convertOctal">Octal</label>
            <input type="checkbox" id="convertBinario"><label for="convertBinario">Binário</label>
            <br><br>
            <!-- botão de conversão -->
            <button onclick="converter()">Converter</button>
            <!-- saída de resultados -->
            <div id="output"></div>
        </div>
        <!-- script javascript -->
        <script>
             const videoEfeito = document.getElementById('efeito-conversao');
        const outputDiv = document.getElementById('output');

        // Esta função só toca o vídeo. O resto acontece quando o vídeo termina.
        function converter() {
            // Esconde o resultado anterior
            outputDiv.style.display = 'none';

            // Valida a entrada antes de tocar o vídeo
            if (!validarEntrada(document.getElementById('inputValue').value, document.getElementById('inputBase').value)) {
                alert('Por favor, insira um número válido para a base selecionada.');
                return; // Para a execução se for inválido
            }

            // Se a entrada for válida, mostra e toca o vídeo
            videoEfeito.style.display = 'block';
            videoEfeito.play();
        }

        // Adiciona um "ouvinte" que executa o código abaixo QUANDO o vídeo termina
        videoEfeito.addEventListener('ended', function() {
            // 1. Esconde o vídeo
            videoEfeito.style.display = 'none';

            // 2. Pega os valores do formulário
            var inputValue = document.getElementById('inputValue').value;
            var inputBase = document.getElementById('inputBase').value;

            // 3. Converte os valores
            var decimalValue = parseInt(inputValue, inputBase === 'hexadecimal' ? 16 : inputBase === 'octal' ? 8 : inputBase === 'binario' ? 2 : 10);
            var outputHTML = '';

            if (document.getElementById('convertDecimal').checked) {
                outputHTML += `<p>Decimal: ${decimalValue}</p>`;
            }
            if (document.getElementById('convertHexadecimal').checked) {
                outputHTML += `<p>Hexadecimal: ${decimalValue.toString(16).toUpperCase()}</p>`;
            }
            if (document.getElementById('convertOctal').checked) {
                outputHTML += `<p>Octal: ${decimalValue.toString(8)}</p>`;
            }
            if (document.getElementById('convertBinario').checked) {
                outputHTML += `<p>Binário: ${decimalValue.toString(2)}</p>`;
            }

            // 4. Mostra o resultado na tela
            if (outputHTML !== '') {
                outputDiv.innerHTML = outputHTML;
                outputDiv.style.display = 'block';
            }
        });

        // Função de validação (sem alterações)
        function validarEntrada(inputValue, inputBase) {
            var validChars = '';
            if (inputBase === 'decimal') {
                validChars = '0123456789';
            } else if (inputBase === 'hexadecimal') {
                validChars = '0123456789ABCDEFabcdef';
            } else if (inputBase === 'octal') {
                validChars = '01234567';
            } else if (inputBase === 'binario') {
                validChars = '01';
            }
            for (var i = 0; i < inputValue.length; i++) {
                if (validChars.indexOf(inputValue[i]) === -1) {
                    return false;
                }
            }
            return true;
        }
    </script>
    </body>

    </html>
